<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive - My Drive</title>
    <link rel="icon" type="image/x-icon" href="https://gstatic.com">
    <style>
        :root {
            --bg-dark: #0b0c10;
            --card-dark: #1f2833;
            --accent: #461111; /* Dark burgundy highlight */
            --y8-red: #c5a059; /* Classic Arcade Gold tint */
            --text: #ffffff;
            --muted: #c5c6c7;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%; background: #151a21;
            padding: 25px 0; text-align: center;
            border-bottom: 2px solid #c5a059;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        header h1 { margin: 0; font-size: 2.2rem; color: #fff; text-shadow: 2px 2px #000; }
        header p { margin: 5px 0 0; color: #c5a059; font-size: 0.95rem; font-weight: bold; }

        .search-wrapper { margin: 30px 0; width: 90%; max-width: 600px; }
        .search-input {
            width: 100%; padding: 15px 25px;
            background: #1f2833; border: 2px solid #c5a059;
            border-radius: 8px; color: var(--text); font-size: 1rem;
            outline: none; box-sizing: border-box;
        }

        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px; width: 90%; max-width: 1200px; padding-bottom: 60px;
        }

        .card {
            background: var(--card-dark); border: 1px solid #2f3e46;
            border-radius: 8px; overflow: hidden; cursor: pointer;
            transition: transform 0.2s, border-color 0.2s; text-align: center;
            padding-bottom: 12px;
        }
        .card:hover { transform: translateY(-3px); border-color: #c5a059; }

        .icon-box {
            width: 100%; height: 110px;
            background: linear-gradient(135deg, #111, #1f2833);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.8rem; border-bottom: 1px solid #2f3e46;
        }

        .title { margin: 12px 10px 3px; font-size: 1.05rem; font-weight: 600; }
        .tag { font-size: 0.75rem; color: #c5a059; text-transform: uppercase; font-weight: bold; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 9999;
            justify-content: center; align-items: center; flex-direction: column;
        }
        .modal-bar {
            width: 90%; max-width: 1000px; display: flex;
            justify-content: space-between; margin-bottom: 10px;
        }
        .btn {
            background: #cc2936; color: white; border: none;
            padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer;
        }
        .btn-gold { background: #c5a059; color: #000; }
        .frame-container {
            width: 90%; max-width: 1000px; height: 80vh;
            background: #000; border-radius: 8px; overflow: hidden;
        }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <header>
        <h1>Y8 Legacy Archive</h1>
        <p>Decentralized Content Distribution System</p>
    </header>

    <div class="search-wrapper">
        <input type="text" id="search" class="search-input" placeholder="Search unblocked archive...">
    </div>

    <div class="grid" id="grid">
        <!-- Y8 Official Embed Frameworks -->
        <div class="card" data-name="slope" onclick="launch('https://y8.com/embed/slope')">
            <div class="icon-box">🟢</div><div class="title">Slope Official</div><div class="tag">Y8 Engine</div>
        </div>
        
        <div class="card" data-name="crazy long runner" onclick="launch('https://y8.com/embed/crazy_long_runner_3d')">
            <div class="icon-box">🏃</div><div class="title">Long Runner 3D</div><div class="tag">Y8 Engine</div>
        </div>

        <div class="card" data-name="hero tower clash" onclick="launch('https://y8.com/embed/hero_tower_clash')">
            <div class="icon-box">🏰</div><div class="title">Hero Tower</div><div class="tag">Y8 Strategy</div>
        </div>

        <div class="card" data-name="boxeden dynamic" onclick="launch('https://y8.com')">
            <div class="icon-box">🔫</div><div class="title">Building Shooter</div><div class="tag">Y8 Action</div>
        </div>

        <div class="card" data-name="cyber cars punk racing" onclick="launch('https://y8.com')">
            <div class="icon-box">🏎️</div><div class="title">Cyber Cars</div><div class="tag">Y8 Racing</div>
        </div>

        <div class="card" data-name="stickman destruction" onclick="launch('https://y8.com')">
            <div class="icon-box">🧍</div><div class="title">Stickman Physics</div><div class="tag">Y8 Ragdoll</div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-bar">
            <button class="btn btn-gold" onclick="fullscreen()">Fullscreen View</button>
            <button class="btn" onclick="kill()">Terminate Connection</button>
        </div>
        <div class="frame-container">
            <iframe id="box" src="" scrolling="no" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        document.getElementById('search').addEventListener('input', function(e) {
            let query = e.target.value.toLowerCase();
            document.querySelectorAll('.card').forEach(card => {
                card.style.display = card.getAttribute('data-name').includes(query) ? "block" : "none";
            });
        });

        function launch(url) {
            document.getElementById('box').src = url;
            document.getElementById('modal').style.display = "flex";
        }
        function kill() {
            document.getElementById('modal').style.display = "none";
            document.getElementById('box').src = "";
        }
        function fullscreen() {
            let f = document.getElementById('box');
            if (f.requestFullscreen) f.requestFullscreen();
            else if (f.webkitRequestFullscreen) f.webkitRequestFullscreen();
        }
    </script>
</body>
</html>
