<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive - My Drive</title> <!-- Stealth Tab Disguise -->
    <link rel="icon" type="image/x-icon" href="https://gstatic.com">
    <style>
        :root {
            --bg-dark: #0f0f12;
            --card-dark: #16161c;
            --accent: #00b4d8;
            --text: #ffffff;
            --muted: #8d99ae;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%; background: var(--card-dark);
            padding: 25px 0; text-align: center;
            border-bottom: 1px solid #23232e;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        header h1 { margin: 0; font-size: 2rem; color: var(--accent); }
        header p { margin: 5px 0 0; color: var(--muted); font-size: 0.9rem; }

        .search-wrapper { margin: 30px 0; width: 90%; max-width: 600px; }
        .search-input {
            width: 100%; padding: 15px 25px;
            background: var(--card-dark); border: 2px solid #23232e;
            border-radius: 50px; color: var(--text); font-size: 1rem;
            outline: none; box-sizing: border-box; transition: 0.3s;
        }
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(0,180,216,0.2); }

        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px; width: 90%; max-width: 1200px; padding-bottom: 60px;
        }

        .card {
            background: var(--card-dark); border: 1px solid #23232e;
            border-radius: 12px; overflow: hidden; cursor: pointer;
            transition: transform 0.2s, border-color 0.2s; text-align: center;
            padding-bottom: 15px;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); }

        .icon-box {
            width: 100%; height: 110px;
            background: linear-gradient(135deg, #1d1d26, #0f0f12);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; border-bottom: 1px solid #23232e;
        }

        .title { margin: 12px 10px 3px; font-size: 1rem; font-weight: 600; }
        .tag { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }

        /* Fullscreen Player Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 9999;
            justify-content: center; align-items: center; flex-direction: column;
        }
        .modal-bar {
            width: 90%; max-width: 1000px; display: flex;
            justify-content: space-between; margin-bottom: 10px;
        }
        .btn {
            background: #e63946; color: white; border: none;
            padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer;
        }
        .btn-blue { background: var(--accent); }
        .frame-container {
            width: 90%; max-width: 1000px; height: 80vh;
            background: #000; border-radius: 8px; overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
        }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <header>
        <h1>Cloud Workspace Node</h1>
        <p>Resource Directory & Assets</p>
    </header>

    <div class="search-wrapper">
        <input type="text" id="search" class="search-input" placeholder="Quick filter modules...">
    </div>

    <div class="grid" id="grid">
        <!-- Game Cards -->
        <div class="card" data-name="retro bowl" onclick="launch('https://github.io')">
            <div class="icon-box">🏈</div><div class="title">Retro Bowl</div><div class="tag">Sports</div>
        </div>
        <div class="card" data-name="1v1.lol" onclick="launch('https://github.io')">
            <div class="icon-box">🎯</div><div class="title">1v1.lol</div><div class="tag">Action</div>
        </div>
        <div class="card" data-name="run 3" onclick="launch('https://github.io')">
            <div class="icon-box">🌌</div><div class="title">Run 3</div><div class="tag">Endless</div>
        </div>
        <div class="card" data-name="cookie clicker" onclick="launch('https://github.io')">
            <div class="icon-box">🍪</div><div class="title">Cookie Clicker</div><div class="tag">Idle</div>
        </div>
        <div class="card" data-name="tetris" onclick="launch('https://github.io')">
            <div class="icon-box">🧱</div><div class="title">Tetris</div><div class="tag">Puzzle</div>
        </div>
        <div class="card" data-name="bitlife" onclick="launch('https://github.io')">
            <div class="icon-box">💼</div><div class="title">Bitlife</div><div class="tag">Simulator</div>
        </div>
        <div class="card" data-name="paper io 2" onclick="launch('https://github.io')">
            <div class="icon-box">🧻</div><div class="title">Paper.io 2</div><div class="tag">Multiplayer</div>
        </div>
        <div class="card" data-name="drive mad" onclick="launch('https://github.io')">
            <div class="icon-box">🚗</div><div class="title">Drive Mad</div><div class="tag">Driving</div>
        </div>
    </div>

    <!-- Gameplay Overlay -->
    <div id="modal" class="modal">
        <div class="modal-bar">
            <button class="btn btn-blue" onclick="fullscreen()">Fullscreen</button>
            <button class="btn" onclick="kill()">Close Frame</button>
        </div>
        <div class="frame-container">
            <iframe id="box" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // Realtime Search Engine
        document.getElementById('search').addEventListener('input', function(e) {
            let query = e.target.value.toLowerCase();
            document.querySelectorAll('.card').forEach(card => {
                card.style.display = card.getAttribute('data-name').includes(query) ? "block" : "none";
            });
        });

        // Frame Controller Actions
        function launch(url) {
            document.getElementById('box').src = url;
            document.getElementById('modal').style.display = "flex";
        }
        function kill() {
            document.getElementById('modal').style.display = "none";
            document.getElementById('box').src = "";
        }
        function fullscreen() {
            let f = document.getElementById('box');
            if (f.requestFullscreen) f.requestFullscreen();
            else if (f.webkitRequestFullscreen) f.webkitRequestFullscreen();
        }
    </script>
</body>
</html>
